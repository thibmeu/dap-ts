services:
  leader:
    image: ${JANUS_IMAGE:-dap-ts-janus:64e2581}
    build:
      context: ${JANUS_SOURCE}
      dockerfile: Dockerfile.interop_aggregator
      args:
        PROFILE: ${JANUS_PROFILE:-ci}
    ports:
      - "9001:8080"
  helper:
    image: ${JANUS_IMAGE:-dap-ts-janus:64e2581}
    build:
      context: ${JANUS_SOURCE}
      dockerfile: Dockerfile.interop_aggregator
      args:
        PROFILE: ${JANUS_PROFILE:-ci}
    ports:
      - "9002:8080"
